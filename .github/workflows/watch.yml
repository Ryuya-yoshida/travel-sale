name: 旅行セール巡回

on:
  schedule:
    - cron: "7 */3 * * *"
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "LINE にも送る（テスト用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sale-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: セール情報を集めてページを作る
        run: python main.py
      - name: LINE に朝のお知らせを送る
        if: github.event.schedule == '50 23 * * *' || inputs.notify
        run: python notify_line.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "セール情報を更新"
          git push
